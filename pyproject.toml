[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfsk-modem"
version = "0.1.0"
description = "Software-defined acoustic air-gap modem transmitting ASCII text via BFSK audio."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PyFSK-Modem Developers"}
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "sounddevice>=0.4.5",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
pyfsk-modem = "pyfsk_modem.cli:main"
